<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kelola Voucher — Admin JavasMedia</title>
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
<nav class="admin-nav">
  <span class="brand">JavasMedia Admin</span>
  <a href="/admin/produk">Produk</a>
  <a href="/admin/artikel">Artikel</a>
  <a href="/admin/voucher" class="active">Voucher</a>
  <a href="/admin/dekorasi">Dekorasi Toko</a>
  <span class="spacer"></span>
  <button id="logoutBtn">Keluar</button>
</nav>
<div class="admin-wrap">
  <div class="admin-header">
    <h1>Voucher & Promo</h1>
  </div>

  <div class="form-card" style="margin-bottom:24px;">
    <h3 id="formTitle" style="margin-bottom:14px;font-size:14px;">Tambah Voucher Baru</h3>
    <form id="voucherForm">
      <input type="hidden" id="editId">
      <div class="form-row">
        <div class="form-group">
          <label>Kode Voucher</label>
          <input type="text" id="code" required placeholder="Contoh: JAVASPERT">
        </div>
        <div class="form-group">
          <label>Tipe Diskon</label>
          <select id="discountType">
            <option value="percent">Persentase (%)</option>
            <option value="fixed">Nominal Tetap (Rp)</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label id="discountValueLabel">Diskon (%)</label>
          <input type="number" id="discountValue" required min="1">
        </div>
        <div class="form-group" id="maxDiscountGroup">
          <label>Maksimal Potongan, Rp (opsional)</label>
          <input type="number" id="maxDiscount" min="1" placeholder="Contoh: 20000">
        </div>
      </div>
      <div class="form-group">
        <label>Deskripsi</label>
        <input type="text" id="description" placeholder="Contoh: Untuk pelanggan baru">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Berlaku Mulai (opsional)</label>
          <input type="date" id="validFrom">
        </div>
        <div class="form-group">
          <label>Berlaku Sampai (opsional)</label>
          <input type="date" id="validUntil">
        </div>
        <div class="form-group">
          <label>Status</label>
          <select id="isActive">
            <option value="true">Aktif</option>
            <option value="false">Nonaktif</option>
          </select>
        </div>
      </div>
      <button type="submit" class="btn btn-primary" id="submitBtn">Simpan Voucher</button>
      <button type="button" class="btn btn-secondary" id="cancelEditBtn" style="display:none;">Batal Edit</button>
      <div id="alertBox" style="margin-top:14px;"></div>
    </form>
  </div>

  <div id="content">Memuat...</div>
</div>
<script>
function formatRupiah(n) {
  return 'Rp' + Number(n).toLocaleString('id-ID');
}

function updateDiscountTypeUI() {
  const type = document.getElementById('discountType').value;
  const isPercent = type === 'percent';
  document.getElementById('discountValueLabel').textContent = isPercent ? 'Diskon (%)' : 'Potongan (Rp)';
  document.getElementById('discountValue').max = isPercent ? 100 : '';
  document.getElementById('maxDiscountGroup').style.display = isPercent ? '' : 'none';
}
document.getElementById('discountType').addEventListener('change', updateDiscountTypeUI);
updateDiscountTypeUI();

async function loadVouchers() {
  const res = await fetch('/api/admin/vouchers');
  const vouchers = await res.json();
  const content = document.getElementById('content');
  if (vouchers.length === 0) {
    content.innerHTML = '<div class="empty-state">Belum ada voucher.</div>';
    return;
  }
  let html = '<table><thead><tr><th>Kode</th><th>Diskon</th><th>Deskripsi</th><th>Berlaku</th><th>Status</th><th>Aksi</th></tr></thead><tbody>';
  vouchers.forEach((v) => {
    const discText = v.discount_type === 'fixed'
      ? formatRupiah(v.discount_value)
      : v.discount_value + '%' + (v.max_discount_amount ? ' (maks ' + formatRupiah(v.max_discount_amount) + ')' : '');
    const validText = [
      v.valid_from ? 'mulai ' + new Date(v.valid_from).toLocaleDateString('id-ID') : null,
      v.valid_until ? 's/d ' + new Date(v.valid_until).toLocaleDateString('id-ID') : null
    ].filter(Boolean).join(' ') || '-';
    html += '<tr>' +
      '<td><strong>' + v.code + '</strong></td>' +
      '<td>' + discText + '</td>' +
      '<td>' + (v.description || '-') + '</td>' +
      '<td>' + validText + '</td>' +
      '<td>' + (v.is_active ? 'Aktif' : 'Nonaktif') + '</td>' +
      '<td><div class="action-group">' +
        '<button class="btn btn-secondary btn-small" onclick=\'editVoucher(' + JSON.stringify(v) + ')\'>Edit</button>' +
        '<button class="btn btn-secondary btn-small" onclick=\'duplicateVoucher(' + JSON.stringify(v) + ')\'>Duplikat</button>' +
        '<button class="btn btn-danger btn-small" onclick="hapusVoucher(' + v.id + ', \'' + v.code + '\')">Hapus</button>' +
      '</div></td>' +
    '</tr>';
  });
  html += '</tbody></table>';
  content.innerHTML = html;
}

function fillVoucherForm(v) {
  document.getElementById('code').value = v.code;
  document.getElementById('discountType').value = v.discount_type || 'percent';
  document.getElementById('discountValue').value = v.discount_value;
  document.getElementById('maxDiscount').value = v.max_discount_amount || '';
  document.getElementById('description').value = v.description || '';
  document.getElementById('validFrom').value = v.valid_from ? v.valid_from.substring(0, 10) : '';
  document.getElementById('validUntil').value = v.valid_until ? v.valid_until.substring(0, 10) : '';
  document.getElementById('isActive').value = String(v.is_active);
  updateDiscountTypeUI();
}

function editVoucher(v) {
  document.getElementById('editId').value = v.id;
  fillVoucherForm(v);
  document.getElementById('formTitle').textContent = 'Edit Voucher: ' + v.code;
  document.getElementById('submitBtn').textContent = 'Simpan Perubahan';
  document.getElementById('cancelEditBtn').style.display = 'inline-flex';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Duplikat voucher - buka form dalam mode "Tambah Baru" (bukan edit id
// yang lama) tapi udah keisi semua data dari voucher yang di-duplikat,
// jadi Amir tinggal ganti kode + seperlunya lalu simpan sebagai voucher baru.
function duplicateVoucher(v) {
  document.getElementById('editId').value = '';
  fillVoucherForm(Object.assign({}, v, { code: v.code + '-COPY' }));
  document.getElementById('formTitle').textContent = 'Duplikat dari: ' + v.code;
  document.getElementById('submitBtn').textContent = 'Simpan Voucher Baru';
  document.getElementById('cancelEditBtn').style.display = 'inline-flex';
  document.getElementById('code').focus();
  document.getElementById('code').select();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function resetForm() {
  document.getElementById('voucherForm').reset();
  document.getElementById('editId').value = '';
  document.getElementById('formTitle').textContent = 'Tambah Voucher Baru';
  document.getElementById('submitBtn').textContent = 'Simpan Voucher';
  document.getElementById('cancelEditBtn').style.display = 'none';
  updateDiscountTypeUI();
}
document.getElementById('cancelEditBtn').addEventListener('click', resetForm);

async function hapusVoucher(id, code) {
  if (!confirm('Hapus voucher "' + code + '"?')) return;
  const res = await fetch('/api/admin/vouchers/' + id, { method: 'DELETE' });
  if (res.ok) loadVouchers();
  else alert((await res.json()).error || 'Gagal menghapus voucher.');
}

document.getElementById('voucherForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const alertBox = document.getElementById('alertBox');
  const submitBtn = document.getElementById('submitBtn');
  alertBox.innerHTML = '';
  const editId = document.getElementById('editId').value;
  const payload = {
    code: document.getElementById('code').value.trim(),
    discount_type: document.getElementById('discountType').value,
    discount_value: parseInt(document.getElementById('discountValue').value, 10),
    max_discount_amount: document.getElementById('maxDiscount').value ? parseInt(document.getElementById('maxDiscount').value, 10) : null,
    description: document.getElementById('description').value.trim(),
    valid_from: document.getElementById('validFrom').value || null,
    valid_until: document.getElementById('validUntil').value || null,
    is_active: document.getElementById('isActive').value === 'true'
  };
  submitBtn.classList.add('btn-loading');
  submitBtn.disabled = true;
  try {
    const url = editId ? '/api/admin/vouchers/' + editId : '/api/admin/vouchers';
    const method = editId ? 'PUT' : 'POST';
    const res = await fetch(url, {
      method,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (!res.ok) {
      alertBox.innerHTML = '<div class="alert alert-error">' + (data.error || 'Gagal menyimpan voucher.') + '</div>';
      return;
    }
    resetForm();
    loadVouchers();
  } catch (err) {
    alertBox.innerHTML = '<div class="alert alert-error">Gagal terhubung ke server. Cek koneksi internet lalu coba lagi.</div>';
  } finally {
    submitBtn.classList.remove('btn-loading');
    submitBtn.disabled = false;
  }
});

document.getElementById('logoutBtn').addEventListener('click', async () => {
  await fetch('/admin/logout', { method: 'POST' });
  window.location.href = '/admin/login';
});

loadVouchers();
</script>
</body>
</html>
