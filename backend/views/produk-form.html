<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Form Produk — Admin JavasMedia</title>
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
<nav class="admin-nav">
  <span class="brand">JavasMedia Admin</span>
  <a href="/admin/produk" class="active">Produk</a>
  <a href="/admin/artikel">Artikel</a>
  <a href="/admin/voucher">Voucher</a>
  <a href="/admin/dekorasi">Dekorasi Toko</a>
  <span class="spacer"></span>
  <button id="logoutBtn">Keluar</button>
</nav>
<div class="admin-wrap">
  <div class="admin-header">
    <h1 id="pageTitle">Tambah Produk</h1>
    <a href="/admin/produk" class="btn btn-secondary">← Kembali</a>
  </div>
  <div id="alertBox"></div>
  <div class="form-card" style="max-width:820px;">
    <form id="productForm">
      <div class="form-group">
        <label>Nama Produk</label>
        <input type="text" id="name" required placeholder="Contoh: Kaos Reguler Black">
      </div>
      <div class="form-group">
        <label>Kategori</label>
        <select id="category" required>
          <option value="apparel">Apparel</option>
          <option value="aksesori">Aksesori</option>
          <option value="packaging">Packaging</option>
          <option value="promotion">Promotion Item</option>
          <option value="homedecor">Homedecor</option>
          <option value="others">Others</option>
        </select>
      </div>
      <div class="form-group">
        <label>Deskripsi</label>
        <textarea id="description" placeholder="Deskripsi produk untuk halaman detail..."></textarea>
      </div>
      <div class="form-group">
        <label>Foto Produk (maks 8 foto, foto pertama jadi foto utama)</label>
        <div id="photoPreviewWrap" class="photo-preview-wrap"></div>
        <input type="file" id="photos" accept="image/*" multiple>
        <div class="form-hint">Bisa pilih beberapa foto sekaligus. Pilih foto baru akan MENGGANTI semua foto lama.</div>
      </div>

      <div class="form-group">
        <label>Variasi 1 (opsional, mis. AREA SABLON)</label>
        <input type="text" id="axis1Name" placeholder="Nama variasi 1">
        <div id="axis1OptionsWrap" class="option-chip-wrap"></div>
        <div class="option-add-row">
          <input type="text" id="axis1NewOption" placeholder="Tambah opsi, mis. LOGO, lalu Enter">
          <button type="button" class="btn btn-secondary btn-small" onclick="addAxisOption(1)">+ Tambah</button>
        </div>
      </div>

      <div class="form-group">
        <label>Variasi 2 (opsional, mis. SIZE)</label>
        <input type="text" id="axis2Name" placeholder="Nama variasi 2">
        <div id="axis2OptionsWrap" class="option-chip-wrap"></div>
        <div class="option-add-row">
          <input type="text" id="axis2NewOption" placeholder="Tambah opsi, mis. M, lalu Enter">
          <button type="button" class="btn btn-secondary btn-small" onclick="addAxisOption(2)">+ Tambah</button>
        </div>
      </div>

      <div class="form-group">
        <label>Kombinasi (SKU & Harga per kombinasi)</label>
        <div id="combosWrap"></div>
        <div class="form-hint">Kalau gak ada variasi sama sekali, cukup isi 1 baris SKU + harga di sini.</div>
      </div>

      <button type="submit" class="btn btn-primary">Simpan Produk</button>
    </form>
  </div>
</div>
<script>
const pathParts = window.location.pathname.split('/').filter(Boolean); // ["admin","produk","5","edit"] atau ["admin","produk","baru"]
const isEdit = pathParts[2] !== 'baru';
const productId = isEdit ? pathParts[2] : null;
if (isEdit) document.getElementById('pageTitle').textContent = 'Edit Produk';

// ---------- Foto ----------
let selectedPhotoFiles = [];
let existingPhotoUrls = [];

document.getElementById('photos').addEventListener('change', (e) => {
  selectedPhotoFiles = Array.from(e.target.files).slice(0, 8);
  renderPhotoPreview();
});

function renderPhotoPreview() {
  const wrap = document.getElementById('photoPreviewWrap');
  if (selectedPhotoFiles.length > 0) {
    wrap.innerHTML = selectedPhotoFiles.map((f, i) =>
      '<div class="photo-thumb"><img src="' + URL.createObjectURL(f) + '">' +
      '<div class="photo-move">' +
        '<button type="button" class="chip-move" ' + (i === 0 ? 'disabled' : '') + ' onclick="movePhoto(' + i + ', -1)">▲</button>' +
        '<button type="button" class="chip-move" ' + (i === selectedPhotoFiles.length - 1 ? 'disabled' : '') + ' onclick="movePhoto(' + i + ', 1)">▼</button>' +
      '</div>' +
      '<button type="button" onclick="removeSelectedPhoto(' + i + ')">&times;</button></div>'
    ).join('');
  } else if (existingPhotoUrls.length > 0) {
    wrap.innerHTML = existingPhotoUrls.map((url) => '<div class="photo-thumb"><img src="' + url + '"></div>').join('') +
      '<div class="form-hint" style="width:100%;margin-top:4px;">Foto sekarang. Pilih foto baru di atas untuk mengganti semuanya.</div>';
  } else {
    wrap.innerHTML = '';
  }
}

function removeSelectedPhoto(i) {
  selectedPhotoFiles.splice(i, 1);
  renderPhotoPreview();
}

// Urutan foto nentuin mana yang jadi foto utama (foto pertama) - digeser
// pakai tombol ▲▼ yang sama polanya dengan urutan opsi variasi di atas.
function movePhoto(index, direction) {
  const target = index + direction;
  if (target < 0 || target >= selectedPhotoFiles.length) return;
  const tmp = selectedPhotoFiles[index];
  selectedPhotoFiles[index] = selectedPhotoFiles[target];
  selectedPhotoFiles[target] = tmp;
  renderPhotoPreview();
}

// ---------- Variasi 2 tingkat ----------
let axis1Options = [];
let axis2Options = [];
let combosData = {}; // key "opt1|||opt2" -> { sku, price, price_old }
let selectedCombos = new Set(); // key yang dicentang, buat "Terapkan ke Terpilih"

function comboKey(o1, o2) { return (o1 || '') + '|||' + (o2 || ''); }

function currentCombos() {
  if (axis1Options.length === 0) return [{ option_1: null, option_2: null }];
  if (axis2Options.length === 0) return axis1Options.map((o) => ({ option_1: o, option_2: null }));
  const combos = [];
  axis1Options.forEach((o1) => axis2Options.forEach((o2) => combos.push({ option_1: o1, option_2: o2 })));
  return combos;
}

function renderOptionChips(axisNum) {
  const options = axisNum === 1 ? axis1Options : axis2Options;
  const wrap = document.getElementById('axis' + axisNum + 'OptionsWrap');
  wrap.innerHTML = options.map((o, i) =>
    '<span class="option-chip">' +
      '<button type="button" class="chip-move" ' + (i === 0 ? 'disabled' : '') + ' onclick="moveAxisOption(' + axisNum + ', ' + i + ', -1)">▲</button>' +
      '<button type="button" class="chip-move" ' + (i === options.length - 1 ? 'disabled' : '') + ' onclick="moveAxisOption(' + axisNum + ', ' + i + ', 1)">▼</button>' +
      ' ' + o + ' <button type="button" onclick="removeAxisOption(' + axisNum + ', \'' + o.replace(/'/g, "\\'") + '\')">&times;</button></span>'
  ).join('');
}

// Urutan chip nentuin urutan baris di tabel kombinasi di bawah - digeser
// pakai tombol ▲▼, bukan drag-and-drop, biar lebih pasti kepencet.
function moveAxisOption(axisNum, index, direction) {
  const arr = axisNum === 1 ? axis1Options : axis2Options;
  const target = index + direction;
  if (target < 0 || target >= arr.length) return;
  const tmp = arr[index];
  arr[index] = arr[target];
  arr[target] = tmp;
  renderOptionChips(axisNum);
  renderCombosTable();
}

function addAxisOption(axisNum) {
  const input = document.getElementById('axis' + axisNum + 'NewOption');
  const val = input.value.trim();
  if (!val) return;
  const arr = axisNum === 1 ? axis1Options : axis2Options;
  if (arr.includes(val)) { input.value = ''; return; }
  arr.push(val);
  input.value = '';
  renderOptionChips(axisNum);
  renderCombosTable();
}

function removeAxisOption(axisNum, val) {
  if (axisNum === 1) axis1Options = axis1Options.filter((o) => o !== val);
  else axis2Options = axis2Options.filter((o) => o !== val);
  renderOptionChips(axisNum);
  renderCombosTable();
}

function renderCombosTable() {
  const combos = currentCombos();
  const wrap = document.getElementById('combosWrap');
  const showOpt1 = axis1Options.length > 0;
  const showOpt2 = axis2Options.length > 0;
  const showCheck = combos.length > 1;
  const axis1Label = document.getElementById('axis1Name').value.trim() || 'Variasi 1';
  const axis2Label = document.getElementById('axis2Name').value.trim() || 'Variasi 2';

  // buang centang buat kombinasi yang udah gak ada lagi (misal opsi variasi dihapus)
  const validKeys = new Set(combos.map((c) => comboKey(c.option_1, c.option_2)));
  Array.from(selectedCombos).forEach((k) => { if (!validKeys.has(k)) selectedCombos.delete(k); });

  let bulkHtml = '';
  if (showCheck) {
    bulkHtml =
      '<div class="bulk-edit-bar">' +
        '<span class="bulk-edit-label">Isi massal:</span>' +
        '<select id="bulkField">' +
          '<option value="price">Harga</option>' +
          '<option value="price_old">Harga Coret</option>' +
          '<option value="sku">SKU</option>' +
        '</select>' +
        '<input type="text" id="bulkValue" placeholder="Nilai...">' +
        '<button type="button" class="btn btn-secondary btn-small" onclick="applyBulkValue(\'all\')">Terapkan ke Semua</button>' +
        '<button type="button" class="btn btn-secondary btn-small" onclick="applyBulkValue(\'selected\')">Terapkan ke Terpilih (<span id="bulkSelectedCount">' + selectedCombos.size + '</span>)</button>' +
      '</div>' +
      '<div class="form-hint" style="margin:-4px 0 10px;">Untuk SKU: nilai di atas jadi kode dasar, kode variasinya (mis. ukuran) otomatis ditambah di belakang tiap baris biar tetap unik (contoh: RB-CUSTOM jadi RB-CUSTOM-M, RB-CUSTOM-L, dst).</div>';
  }

  let html = bulkHtml + '<table><thead><tr>';
  if (showCheck) html += '<th class="combo-check-col"><input type="checkbox" id="comboSelectAll"></th>';
  if (showOpt1) html += '<th>' + axis1Label + '</th>';
  if (showOpt2) html += '<th>' + axis2Label + '</th>';
  html += '<th>SKU</th><th>Harga</th><th>Harga Coret</th></tr></thead><tbody>';
  let prevOption1 = null;
  combos.forEach((c, idx) => {
    const key = comboKey(c.option_1, c.option_2);
    const data = combosData[key] || {};
    // Kasih garis pemisah tiap ganti kelompok Variasi 1 (cuma relevan kalau
    // ada 2 tingkat variasi, biar gampang lihat batas antar kelompok saat isi harga).
    const isNewGroup = showOpt2 && idx > 0 && c.option_1 !== prevOption1;
    prevOption1 = c.option_1;
    html += '<tr data-key="' + key.replace(/"/g, '&quot;') + '"' + (isNewGroup ? ' class="combo-group-start"' : '') + '>';
    if (showCheck) html += '<td class="combo-check-col"><input type="checkbox" class="combo-check"' + (selectedCombos.has(key) ? ' checked' : '') + '></td>';
    if (showOpt1) html += '<td>' + c.option_1 + '</td>';
    if (showOpt2) html += '<td>' + c.option_2 + '</td>';
    html += '<td><input type="text" class="combo-sku" value="' + (data.sku || '') + '" placeholder="SKU"></td>';
    html += '<td><input type="number" class="combo-price" value="' + (data.price || '') + '" placeholder="Harga"></td>';
    html += '<td><input type="number" class="combo-price-old" value="' + (data.price_old || '') + '" placeholder="Opsional"></td>';
    html += '</tr>';
  });
  html += '</tbody></table>';
  wrap.innerHTML = html;

  wrap.querySelectorAll('tr[data-key]').forEach((row) => {
    const key = row.dataset.key;
    if (!combosData[key]) combosData[key] = {};
    row.querySelector('.combo-sku').addEventListener('input', (e) => { combosData[key].sku = e.target.value; });
    row.querySelector('.combo-price').addEventListener('input', (e) => { combosData[key].price = e.target.value; });
    row.querySelector('.combo-price-old').addEventListener('input', (e) => { combosData[key].price_old = e.target.value; });
    const checkEl = row.querySelector('.combo-check');
    if (checkEl) {
      checkEl.addEventListener('change', () => {
        if (checkEl.checked) selectedCombos.add(key); else selectedCombos.delete(key);
        const countEl = document.getElementById('bulkSelectedCount');
        if (countEl) countEl.textContent = selectedCombos.size;
        const selectAllEl = document.getElementById('comboSelectAll');
        if (selectAllEl) selectAllEl.checked = selectedCombos.size === combos.length;
      });
    }
  });

  const selectAllEl = document.getElementById('comboSelectAll');
  if (selectAllEl) {
    selectAllEl.checked = combos.length > 0 && selectedCombos.size === combos.length;
    selectAllEl.addEventListener('change', () => {
      if (selectAllEl.checked) combos.forEach((c) => selectedCombos.add(comboKey(c.option_1, c.option_2)));
      else selectedCombos.clear();
      renderCombosTable();
    });
  }
}

// "Isi massal" ala Shopee/TikTok Seller Center - isi 1 nilai lalu terapkan
// ke semua baris kombinasi sekaligus, atau cuma ke baris yang dicentang.
function applyBulkValue(target) {
  const field = document.getElementById('bulkField').value;
  const rawValue = document.getElementById('bulkValue').value.trim();
  if (!rawValue) return;
  const combos = currentCombos();
  const keys = target === 'all'
    ? combos.map((c) => comboKey(c.option_1, c.option_2))
    : Array.from(selectedCombos);
  if (keys.length === 0) {
    alert('Belum ada baris yang dicentang.');
    return;
  }
  keys.forEach((key) => {
    if (!combosData[key]) combosData[key] = {};
    combosData[key][field] = field === 'sku' ? buildVariantSku(rawValue, key) : rawValue;
  });
  renderCombosTable();
}

// SKU per kombinasi = kode dasar + akhiran dari variasinya (mis. RB-CUSTOM-LOGO-M),
// biar walau kode dasarnya diisi sama semua lewat Isi Massal, tiap baris tetap
// otomatis unik - persis kayak "Kode Variasi" di Shopee/TikTok Seller Center.
function buildVariantSku(base, key) {
  const parts = key.split('|||').filter(Boolean).map(sanitizeSkuPart).filter(Boolean);
  return parts.length > 0 ? base + '-' + parts.join('-') : base;
}

function sanitizeSkuPart(s) {
  return s.toString().trim().toUpperCase().replace(/[^A-Z0-9]+/g, '');
}

function collectVariants() {
  const combos = currentCombos();
  const variants = [];
  combos.forEach((c) => {
    const key = comboKey(c.option_1, c.option_2);
    const data = combosData[key] || {};
    if (!data.sku || !data.price) return;
    variants.push({
      sku: String(data.sku).trim(),
      variant_option_1: c.option_1,
      variant_option_2: c.option_2,
      price: parseInt(data.price, 10),
      price_old: data.price_old ? parseInt(data.price_old, 10) : null
    });
  });
  return variants;
}

document.getElementById('axis1Name').addEventListener('input', renderCombosTable);
document.getElementById('axis2Name').addEventListener('input', renderCombosTable);
document.getElementById('axis1NewOption').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); addAxisOption(1); }
});
document.getElementById('axis2NewOption').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); addAxisOption(2); }
});

// ---------- Load / submit ----------
async function loadForEdit() {
  const res = await fetch('/api/admin/products/' + productId);
  if (!res.ok) {
    document.getElementById('alertBox').innerHTML = '<div class="alert alert-error">Produk tidak ditemukan.</div>';
    return;
  }
  const p = await res.json();
  document.getElementById('name').value = p.name;
  document.getElementById('category').value = p.category;
  document.getElementById('description').value = p.description || '';
  document.getElementById('axis1Name').value = p.variant_axis_1_name || '';
  document.getElementById('axis2Name').value = p.variant_axis_2_name || '';

  existingPhotoUrls = (p.images || []).map((i) => i.image_url);
  renderPhotoPreview();

  const seen1 = [];
  const seen2 = [];
  (p.variants || []).forEach((v) => {
    if (v.variant_option_1 && !seen1.includes(v.variant_option_1)) seen1.push(v.variant_option_1);
    if (v.variant_option_2 && !seen2.includes(v.variant_option_2)) seen2.push(v.variant_option_2);
    combosData[comboKey(v.variant_option_1, v.variant_option_2)] = {
      sku: v.sku, price: v.price, price_old: v.price_old
    };
  });
  axis1Options = seen1;
  axis2Options = seen2;
  renderOptionChips(1);
  renderOptionChips(2);
  renderCombosTable();
}

if (isEdit) {
  loadForEdit();
} else {
  renderCombosTable();
}

document.getElementById('productForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const variants = collectVariants();
  const alertBox = document.getElementById('alertBox');
  alertBox.innerHTML = '';
  if (variants.length === 0) {
    alertBox.innerHTML = '<div class="alert alert-error">Minimal 1 kombinasi dengan SKU dan harga wajib diisi.</div>';
    return;
  }
  const formData = new FormData();
  formData.append('name', document.getElementById('name').value.trim());
  formData.append('category', document.getElementById('category').value);
  formData.append('description', document.getElementById('description').value.trim());
  formData.append('variant_axis_1_name', document.getElementById('axis1Name').value.trim());
  formData.append('variant_axis_2_name', document.getElementById('axis2Name').value.trim());
  formData.append('variants_json', JSON.stringify(variants));
  selectedPhotoFiles.forEach((f) => formData.append('photos', f));

  const url = isEdit ? '/api/admin/products/' + productId : '/api/admin/products';
  const method = isEdit ? 'PUT' : 'POST';
  const res = await fetch(url, { method, body: formData });
  const data = await res.json();
  if (!res.ok) {
    alertBox.innerHTML = '<div class="alert alert-error">' + (data.error || 'Gagal menyimpan produk.') + '</div>';
    return;
  }
  window.location.href = '/admin/produk';
});

document.getElementById('logoutBtn').addEventListener('click', async () => {
  await fetch('/admin/logout', { method: 'POST' });
  window.location.href = '/admin/login';
});
</script>
</body>
</html>
