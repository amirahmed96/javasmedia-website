<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Admin — JavasMedia</title>
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <h1>Login Admin JavasMedia</h1>
    <div id="alertBox"></div>
    <form id="loginForm">
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="username" required autofocus>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">Masuk</button>
    </form>
  </div>
</div>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const alertBox = document.getElementById('alertBox');
  alertBox.innerHTML = '';
  try {
    const res = await fetch('/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if (!res.ok) {
      alertBox.innerHTML = '<div class="alert alert-error">' + (data.error || 'Login gagal.') + '</div>';
      return;
    }
    window.location.href = data.redirect || '/admin/produk';
  } catch (err) {
    alertBox.innerHTML = '<div class="alert alert-error">Tidak bisa menghubungi server.</div>';
  }
});
</script>
</body>
</html>
