<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dekorasi Toko — Admin JavasMedia</title>
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
<nav class="admin-nav">
  <span class="brand">JavasMedia Admin</span>
  <a href="/admin/produk">Produk</a>
  <a href="/admin/artikel">Artikel</a>
  <a href="/admin/voucher">Voucher</a>
  <a href="/admin/dekorasi" class="active">Dekorasi Toko</a>
  <span class="spacer"></span>
  <button id="logoutBtn">Keluar</button>
</nav>
<div class="admin-wrap">
  <div class="admin-header"><h1>Slider Homepage</h1></div>
  <div class="upload-card">
    <form id="sliderForm">
      <div class="form-row">
        <input type="file" id="sliderPhoto" accept="image/*" required>
        <input type="text" id="sliderLink" placeholder="Link tujuan saat diklik (opsional, mis. ke halaman produk)" style="max-width:340px;">
      </div>
      <button type="submit" class="btn btn-primary btn-small" id="sliderSubmitBtn" style="margin-top:10px;">+ Tambah Slide</button>
    </form>
    <div class="form-hint">Slide tampil sesuai urutan, bisa diubah dengan tombol ↑↓ di tiap kartu.</div>
    <div id="sliderAlertBox" style="margin-top:10px;"></div>
  </div>
  <div id="slidesContent" class="decor-grid">Memuat...</div>

  <div class="admin-header" style="margin-top:36px;"><h1>Sub Campaign</h1></div>
  <div class="upload-card">
    <form id="subCampaignForm">
      <div class="form-row">
        <input type="file" id="subCampaignPhoto" accept="image/*" required>
        <input type="text" id="subCampaignLabel" placeholder="Teks label (default: SUB CAMPAIGN)" style="max-width:220px;">
        <input type="text" id="subCampaignLink" placeholder="Link tujuan saat diklik (opsional)" style="max-width:280px;">
      </div>
      <button type="submit" class="btn btn-primary btn-small" id="subCampaignSubmitBtn" style="margin-top:10px;">+ Tambah Sub Campaign</button>
    </form>
    <div class="form-hint">Sebaiknya 4 kartu, sesuai desain homepage.</div>
    <div id="subCampaignAlertBox" style="margin-top:10px;"></div>
  </div>
  <div id="subCampaignContent" class="decor-grid">Memuat...</div>
</div>
<script>
async function loadDecor(endpoint, containerId, hasLabel) {
  const res = await fetch(endpoint);
  const items = await res.json();
  const container = document.getElementById(containerId);
  if (items.length === 0) {
    container.innerHTML = '<div class="empty-state">Belum ada.</div>';
    return;
  }
  container.innerHTML = items.map((item, i) => `
    <div class="decor-card">
      <img src="${item.image_url}">
      <div class="decor-body">
        ${hasLabel ? '<div style="font-size:12px;font-weight:700;margin-bottom:2px;">' + (item.label_text || '') + '</div>' : ''}
        <div style="font-size:11px;color:${item.link_url ? '#1e7e42' : '#999'};margin-bottom:6px;word-break:break-all;">${item.link_url ? '🔗 ' + item.link_url : 'Belum ada link'}</div>
        <div class="decor-actions">
          <button class="btn btn-secondary btn-small" ${i === 0 ? 'disabled' : ''} onclick="moveItem('${endpoint}', ${item.id}, 'up', '${containerId}', ${!!hasLabel})">↑</button>
          <button class="btn btn-secondary btn-small" ${i === items.length - 1 ? 'disabled' : ''} onclick="moveItem('${endpoint}', ${item.id}, 'down', '${containerId}', ${!!hasLabel})">↓</button>
          <button class="btn btn-secondary btn-small" onclick="editItem('${endpoint}', ${item.id}, '${containerId}', ${!!hasLabel}, ${JSON.stringify(item.label_text || '')}, ${JSON.stringify(item.link_url || '')})">Edit</button>
          <button class="btn btn-danger btn-small" onclick="deleteItem('${endpoint}', ${item.id}, '${containerId}', ${!!hasLabel})">Hapus</button>
        </div>
      </div>
    </div>
  `).join('');
}

async function moveItem(endpoint, id, direction, containerId, hasLabel) {
  await fetch(endpoint + '/' + id + '/move', {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ direction })
  });
  reloadContainer(containerId, hasLabel);
}

async function deleteItem(endpoint, id, containerId, hasLabel) {
  if (!confirm('Hapus item ini?')) return;
  await fetch(endpoint + '/' + id, { method: 'DELETE' });
  reloadContainer(containerId, hasLabel);
}

function reloadContainer(containerId, hasLabel) {
  if (containerId === 'slidesContent') loadDecor('/api/admin/hero-slides', 'slidesContent', false);
  else loadDecor('/api/admin/sub-campaigns', 'subCampaignContent', true);
}

async function editItem(endpoint, id, containerId, hasLabel, currentLabel, currentLink) {
  const payload = {};
  if (hasLabel) {
    const label = prompt('Teks label:', currentLabel || '');
    if (label === null) return;
    payload.label_text = label;
  }
  const link = prompt('Link tujuan saat diklik (kosongkan kalau tidak perlu):', currentLink || '');
  if (link === null) return;
  payload.link_url = link || null;
  await fetch(endpoint + '/' + id, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  });
  reloadContainer(containerId, hasLabel);
}

document.getElementById('sliderForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const file = document.getElementById('sliderPhoto').files[0];
  if (!file) return;
  const formData = new FormData();
  formData.append('photo', file);
  const link = document.getElementById('sliderLink').value.trim();
  if (link) formData.append('link_url', link);
  const submitBtn = document.getElementById('sliderSubmitBtn');
  const alertBox = document.getElementById('sliderAlertBox');
  alertBox.innerHTML = '';
  submitBtn.classList.add('btn-loading');
  submitBtn.disabled = true;
  try {
    const res = await fetch('/api/admin/hero-slides', { method: 'POST', body: formData });
    if (res.ok) {
      document.getElementById('sliderForm').reset();
      loadDecor('/api/admin/hero-slides', 'slidesContent', false);
    } else {
      alertBox.innerHTML = '<div class="alert alert-error">' + ((await res.json()).error || 'Gagal upload slide.') + '</div>';
    }
  } catch (err) {
    alertBox.innerHTML = '<div class="alert alert-error">Gagal terhubung ke server. Cek koneksi internet lalu coba lagi.</div>';
  } finally {
    submitBtn.classList.remove('btn-loading');
    submitBtn.disabled = false;
  }
});

document.getElementById('subCampaignForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const file = document.getElementById('subCampaignPhoto').files[0];
  if (!file) return;
  const formData = new FormData();
  formData.append('photo', file);
  const label = document.getElementById('subCampaignLabel').value.trim();
  if (label) formData.append('label_text', label);
  const link = document.getElementById('subCampaignLink').value.trim();
  if (link) formData.append('link_url', link);
  const submitBtn = document.getElementById('subCampaignSubmitBtn');
  const alertBox = document.getElementById('subCampaignAlertBox');
  alertBox.innerHTML = '';
  submitBtn.classList.add('btn-loading');
  submitBtn.disabled = true;
  try {
    const res = await fetch('/api/admin/sub-campaigns', { method: 'POST', body: formData });
    if (res.ok) {
      document.getElementById('subCampaignForm').reset();
      loadDecor('/api/admin/sub-campaigns', 'subCampaignContent', true);
    } else {
      alertBox.innerHTML = '<div class="alert alert-error">' + ((await res.json()).error || 'Gagal upload sub campaign.') + '</div>';
    }
  } catch (err) {
    alertBox.innerHTML = '<div class="alert alert-error">Gagal terhubung ke server. Cek koneksi internet lalu coba lagi.</div>';
  } finally {
    submitBtn.classList.remove('btn-loading');
    submitBtn.disabled = false;
  }
});

document.getElementById('logoutBtn').addEventListener('click', async () => {
  await fetch('/admin/logout', { method: 'POST' });
  window.location.href = '/admin/login';
});

loadDecor('/api/admin/hero-slides', 'slidesContent', false);
loadDecor('/api/admin/sub-campaigns', 'subCampaignContent', true);
</script>
</body>
</html>
