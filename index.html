<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JavasMedia — House of Customize</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #FAF8F3; overflow-x: hidden; }
.page { width: 1440px; margin: 0 auto; position: relative; }
.homepage-img { width: 100%; display: block; }

/* Clickable nav areas - invisible overlay */
.nav-area { position: absolute; cursor: pointer; }
.nav-promo  { top: 0; left: 138px; width: 130px; height: 55px; }
.nav-product { top: 0; left: 228px; width: 135px; height: 55px; }
.nav-articles { top: 0; left: 323px; width: 135px; height: 55px; }
.nav-location { top: 0; left: 415px; width: 135px; height: 55px; }
.nav-login { top: 0; right: 0; width: 80px; height: 55px; }
</style>
</head>
<body>
<div class="page">
  <div style="position:relative;">
    <img class="homepage-img" src="homepage.png" alt="JavasMedia — House of Customize" usemap="#navmap">
    <map name="navmap">
      <!-- Nav buttons -->
      <area shape="rect" coords="138,0,268,55" href="promo.html" alt="Promo">
      <area shape="rect" coords="228,0,363,55" href="katalog.html" alt="Product">
      <area shape="rect" coords="323,0,458,55" href="articles.html" alt="Articles">
      <area shape="rect" coords="415,0,550,55" href="location.html" alt="Location">
      <!-- Login icon -->
      <area shape="rect" coords="1360,0,1440,55" href="login.html" alt="Login">
    </map>
  </div>
</div>
</body>
</html>
